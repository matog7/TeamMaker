services:
  db:
    image: postgres:16-alpine
    container_name: teammaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teammaker
      POSTGRES_USER: teammaker
      POSTGRES_PASSWORD: teammaker
    ports:
      - "5546:5432"
    volumes:
      - db_data_teammaker:/var/lib/postgresql/data
      - "./initdb:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammaker -d teammaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: teammaker-adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"

volumes:
  db_data_teammaker:
    driver: local
